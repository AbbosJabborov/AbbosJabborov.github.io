<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Arcade Shelf — My Games</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

</head>
<body class="crt rgb-shift">

  <!-- Arcade Cabinet Frame -->
  <div class="cabinet">
    <div class="cabinet-top"></div>

    <!-- Screen area (CRT) -->
    <div class="screen-wrap">
      <!-- Boot overlay (shown first) -->
      <div id="boot-overlay" class="overlay visible">
        <div class="boot-center">
          <div class="boot-text" id="bootText"></div>
          <div class="press-start" id="pressStart">PRESS START</div>
          <div class="cartridge-slot">
            <div class="cartridge" id="cartridge">
              <div class="label">ROM: 2048</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Actual UI content (hidden under boot) -->
      <div id="screen" class="screen">

    <div class="title">My Game Shelf</div>

    <!-- ========================= -->
    <!-- WEBGL PROJECTS           -->
    <!-- ========================= -->
    <div class="section-title">WebGL Projects</div>
    <div class="shelf">
        <div class="game-card" onclick="openGame('2048')" data-title="2048 WebGL">
            <img src="assets/pixelated.png">
            <span>2048</span>
        </div>

        <div class="game-card" onclick="openGame('snakey-bakey')" data-title="Snakey Bakey WebGL">
            <img src="assets/winter.png">
            <span>Snakey Bakey</span>
        </div>

        <div class="game-card" onclick="openGame('wire-rush')" data-title="Wire Rush WebGL">
            <img src="assets/sky.png">
            <span>Wire Rush</span>
        </div>
    </div>


    <!-- ========================= -->
    <!-- PC BUILDS                -->
    <!-- ========================= -->
    <div class="section-title">PC Builds</div>
    <div class="shelf">
        <div class="game-card" onclick="openPC('2048-pc')" data-title="2048 PC">
            <img src="assets/pixelated.png">
            <span>2048 PC</span>
        </div>

        <div class="game-card" onclick="openPC('snakey-pc')" data-title="Snakey Bakey PC">
            <img src="assets/borderlands.png">
            <span>Snakey Bakey PC</span>
        </div>
    </div>


    <!-- ========================= -->
    <!-- MOBILE PROJECTS          -->
    <!-- ========================= -->
    <div class="section-title">Mobile Projects</div>
    <div class="shelf">
        <div class="game-card" onclick="openMobile('jump-mobile')" data-title="Jump Game Mobile">
            <img src="assets/winter.png">
            <span>Jump Game</span>
        </div>

        <div class="game-card" onclick="openMobile('runner-mobile')" data-title="Runner Game Mobile">
            <img src="assets/sky.png">
            <span>Runner Game</span>
        </div>
    </div>
</div>


    <div class="cabinet-bottom">
      <div class="controls">
        <div class="btn start" id="startButton">START</div>
        <div class="btn select">SELECT</div>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
