<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abbos Jabborov | Portfolio</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Poppins', sans-serif;
  }

  #content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    z-index: 0;
  }

  #content h1 {
    font-size: 4em;
    margin: 0;
    letter-spacing: 2px;
  }

  #content p {
    font-size: 1.2em;
    margin-top: 0.5em;
    color: #bbb;
  }

  canvas {
    position: absolute;
    inset: 0;
    cursor: none;
    z-index: 1;
  }

  #hint {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,0.4);
    font-size: 0.9em;
  }
</style>
</head>
<body>

<div id="content">
  <h1>Abbos Jabborov</h1>
  <p>"Developer" • Designer • Totally not AI</p>
</div>

<canvas id="scratchCanvas"></canvas>
<div id="hint">(hold left mouse button to erase — scroll to resize)</div>

<script>
const canvas = document.getElementById('scratchCanvas');
const ctx = canvas.getContext('2d');
let brushSize = 50;
let isDrawing = false;

// Resize + paint once
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  drawOverlay();
}

function drawOverlay() {
  const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
  gradient.addColorStop(0, '#606c38');
  gradient.addColorStop(1, '#dda15e');
  ctx.globalCompositeOperation = 'source-over'; // normal paint mode
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

canvas.addEventListener('mousedown', () => isDrawing = true);
canvas.addEventListener('mouseup', () => isDrawing = false);
canvas.addEventListener('mouseleave', () => isDrawing = false);

canvas.addEventListener('mousemove', e => {
  if (!isDrawing) return;
  ctx.globalCompositeOperation = 'destination-out'; // erase mode
  ctx.beginPath();
  ctx.arc(e.clientX, e.clientY, brushSize, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalCompositeOperation = 'destination-out';
});

// Change brush size with scroll
window.addEventListener('wheel', e => {
  brushSize -= e.deltaY * 0.05;
  brushSize = Math.max(10, Math.min(200, brushSize));
});
</script>

</body>
</html>
